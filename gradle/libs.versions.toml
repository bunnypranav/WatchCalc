# Versions pinned to what is already installed/cached on this machine
# (Android Studio's AGP 9.3.0 + Kotlin 2.2.10 + Gradle 9.5.0), so the first
# build does not have to fetch a whole new toolchain.
[versions]
agp              = "9.3.0"
kotlin           = "2.2.10"
composeBom       = "2026.09.00"
wearCompose      = "1.6.2"
activityCompose  = "1.13.0"
coreKtx          = "1.19.0"
lifecycle        = "2.11.0"
tiles            = "1.6.2"
protolayout      = "1.4.2"
concurrentFutures= "1.3.0"
junit            = "4.13.2"

[libraries]
core-ktx                 = { module = "androidx.core:core-ktx",                     version.ref = "coreKtx" }
activity-compose         = { module = "androidx.activity:activity-compose",         version.ref = "activityCompose" }
lifecycle-viewmodel      = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-bom              = { module = "androidx.compose:compose-bom",               version.ref = "composeBom" }
compose-ui               = { module = "androidx.compose.ui:ui" }
compose-foundation       = { module = "androidx.compose.foundation:foundation" }
compose-ui-tooling       = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-preview       = { module = "androidx.compose.ui:ui-tooling-preview" }
wear-compose-foundation  = { module = "androidx.wear.compose:compose-foundation",   version.ref = "wearCompose" }
wear-tiles               = { module = "androidx.wear.tiles:tiles",                   version.ref = "tiles" }
protolayout              = { module = "androidx.wear.protolayout:protolayout",       version.ref = "protolayout" }
protolayout-expression   = { module = "androidx.wear.protolayout:protolayout-expression", version.ref = "protolayout" }
concurrent-futures       = { module = "androidx.concurrent:concurrent-futures",      version.ref = "concurrentFutures" }
junit                    = { module = "junit:junit",                                version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application",              version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",          version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose",   version.ref = "kotlin" }
